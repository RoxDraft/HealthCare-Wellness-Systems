<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แผนที่ระบบสุขภาพไทย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column; the 3D stage breaks out with a side panel; comparison uses two columns that stack on phones */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --fg:#14211E; --muted:#5A6B66; --line:#D6DEDB;
  --accent:#0B7A63; --accent2:#B8661F;
  --global:#2F63C9; --public:#0B7A63; --private:#B8661F; --people:#8A4FB8;
  --e-fund:#C2410C; --e-reg:#6D28D9; --e-tech:#1D6FB8; --e-svc:#0F8A5F;
  --stage:#0F1A1F; --stage-fg:#E6EEEC; --stage-muted:#8FA3A0;
  --hi:#B42318; --mid:#B7791F; --lo:#4B6B63;
  --display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1513; --surface:#14201D; --fg:#E3ECE9; --muted:#9AB0AA; --line:#26362F;
  --accent:#3CC4A0; --accent2:#E59A52; --global:#6E9BF0; --public:#3CC4A0; --private:#E59A52; --people:#B98AE0;
  --e-fund:#F08A4B; --e-reg:#A98BF2; --e-tech:#5FA8EC; --e-svc:#45C98F;
  --stage:#081012; --stage-fg:#E6EEEC; --stage-muted:#8FA3A0;
  --hi:#F2705F; --mid:#E2B04F; --lo:#86A89E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1513; --surface:#14201D; --fg:#E3ECE9; --muted:#9AB0AA; --line:#26362F;
  --accent:#3CC4A0; --accent2:#E59A52; --global:#6E9BF0; --public:#3CC4A0; --private:#E59A52; --people:#B98AE0;
  --e-fund:#F08A4B; --e-reg:#A98BF2; --e-tech:#5FA8EC; --e-svc:#45C98F;
  --stage:#081012; --stage-fg:#E6EEEC; --stage-muted:#8FA3A0;
  --hi:#F2705F; --mid:#E2B04F; --lo:#86A89E; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:56px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:clamp(28px,5vw,44px);font-weight:700}
h2{font-size:clamp(21px,3vw,27px);font-weight:600}
h3{font-size:17px;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lead{max-width:68ch;color:var(--muted);font-size:16px}
header.top{display:flex;flex-direction:column;gap:12px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 0 4px 12px;max-width:80ch}
section{display:flex;flex-direction:column;gap:18px}
.sec-head{display:flex;flex-direction:column;gap:6px}
.sec-head p{color:var(--muted);max-width:72ch}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{font:500 13px var(--body);padding:6px 12px;border:0;background:var(--surface);color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 3D stage */
.stage-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;border-radius:14px;overflow:hidden;background:var(--stage);color:var(--stage-fg)}
@media (max-width:860px){.stage-wrap{grid-template-columns:1fr}}
.stage{position:relative;height:min(72vh,640px);min-height:440px}
.stage canvas{display:block;width:100%;height:100%;cursor:grab}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-140%);font-size:11.5px;line-height:1.2;white-space:nowrap;padding:2px 6px;border-radius:4px;background:rgba(8,16,18,.62);color:var(--stage-fg);transition:opacity .15s}
.lbl.big{font-size:13px;font-weight:600}
.lbl.layer{background:transparent;color:var(--stage-muted);font-family:var(--mono);font-size:11px;letter-spacing:.05em}
.countrybar{position:absolute;left:12px;right:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px}
.toolbar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font:500 12px var(--body);display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid rgba(230,238,236,.25);background:rgba(8,16,18,.7);color:var(--stage-fg);cursor:pointer}
.chip[aria-pressed="false"]{opacity:.5}
.countrybar .chip[aria-pressed="true"]{background:var(--stage-fg);color:var(--stage);opacity:1}
.countrybar .chip[aria-pressed="false"]{opacity:.85}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.panel{padding:18px;display:flex;flex-direction:column;gap:12px;border-left:1px solid rgba(230,238,236,.1);max-height:min(72vh,640px);overflow:auto}
@media (max-width:860px){.panel{border-left:0;border-top:1px solid rgba(230,238,236,.1);max-height:none}}
.panel h3{color:var(--stage-fg)}
.panel .kind{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--stage-muted)}
.panel p{font-size:14px;color:#CBD8D5}
.panel blockquote{margin:0;padding-left:10px;border-left:2px solid var(--stage-muted);font-size:14px;color:var(--stage-fg)}
.panel ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}
.panel li{display:flex;gap:8px;align-items:baseline;color:#CBD8D5}
.panel li button{all:unset;cursor:pointer;color:var(--stage-fg);text-decoration:underline;text-decoration-color:rgba(230,238,236,.3);text-underline-offset:3px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12px;color:var(--stage-muted)}
.legend span{display:flex;gap:6px;align-items:center}
.ln{width:18px;height:3px;border-radius:2px;flex:none;display:inline-block}
.fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--stage-muted);pointer-events:none}

/* actor cards */
.actors{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.group .gh{display:flex;align-items:center;gap:8px}
.group ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.group b{font-weight:600}
.muted{color:var(--muted)}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-weight:600;font-size:13px;color:var(--muted);background:var(--bg)}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px;white-space:nowrap}
.lvl{display:inline-block;font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:4px;border:1px solid var(--line);white-space:nowrap}
th button{all:unset;cursor:pointer}

/* compare */
.pickers{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.pickers label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
select{font:500 14px var(--body);padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.swatch{width:12px;height:12px;border-radius:3px;display:inline-block}
.cmp{display:grid;grid-template-columns:160px minmax(0,1fr) minmax(0,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.cmp>div{padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;min-width:0}
.cmp .k{font-family:var(--display);font-weight:600;font-size:13px;color:var(--muted);background:var(--bg)}
.cmp .h{font-family:var(--display);font-weight:700;font-size:16px}
.cmp .h small{display:block;font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}
.cmp .a{border-left:3px solid var(--accent)} .cmp .b{border-left:3px solid var(--accent2)}
.cmp .q{font-weight:500}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stats span{display:flex;flex-direction:column;font-family:var(--mono);font-size:15px}
.stats small{font-family:var(--body);font-size:11.5px;color:var(--muted)}
@media (max-width:700px){.cmp{grid-template-columns:1fr}.cmp .k{border-bottom:0;padding-bottom:2px}}
.axes{display:flex;flex-direction:column;gap:20px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.axis{display:flex;flex-direction:column;gap:6px}
.axis .ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);gap:12px}
.axis .ends span:last-child{text-align:right}
.track{position:relative;height:66px;border-bottom:2px solid var(--line)}
.mk{position:absolute;transform:translateX(-50%);font-family:var(--mono);font-size:11px;padding:1px 5px;border-radius:4px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.mk.A{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.mk.B{background:var(--accent2);border-color:var(--accent2);color:var(--surface);font-weight:600}

/* matrix */
.matrix{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:6px;overflow-x:auto}
.matrix .ax{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;padding:4px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:84px;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;min-width:0}
.cell.hot{border-color:var(--hi);border-width:2px}
.mchip{font-size:12px;line-height:1.3;padding:3px 7px;border-radius:5px;background:var(--bg);border:1px solid var(--line);cursor:pointer;text-align:left;color:var(--fg);font-family:var(--body)}
.mchip.g{border-left:3px solid var(--global)} .mchip.d{border-left:3px solid var(--public)}
.mchip:hover{border-color:var(--accent)}
@media (max-width:640px){.matrix{grid-template-columns:auto repeat(3,minmax(110px,1fr))}}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{display:inline-block;font-family:var(--mono);font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p1{background:color-mix(in srgb,var(--hi) 16%,transparent);color:var(--hi)}
.p2{background:color-mix(in srgb,var(--mid) 18%,transparent);color:var(--mid)}
.p3{background:color-mix(in srgb,var(--lo) 18%,transparent);color:var(--lo)}
tr.flash td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.scope{font-size:12px;color:var(--muted);white-space:nowrap}
footer{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px;max-width:80ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
(function(){
/* ================= i18n ================= */
let lang='th';
try{const s=localStorage.getItem('hsm-lang');if(s==='en'||s==='th')lang=s;}catch(e){}
const t=x=>x==null?'':(typeof x==='string'?x:x[lang==='en'?1:0]);
const STR={
 eyebrow:['ระบบสุขภาพไทย × เครือข่ายสุขภาพโลก · ฉบับ พ.ย. 2569','Thai health system × global health network · Nov 2026'],
 h1:['ใครอยู่ในระบบสุขภาพไทย และต่างจากประเทศอื่นอย่างไร','Who makes up Thailand\'s health system, and how it differs from others'],
 lead:['แผนที่ผู้เล่นทั้งภาครัฐ เอกชน ชุมชน และองค์กรนานาชาติ เทียบกับโมเดลของ 7 ประเทศ พร้อมระดับการรักษา สิทธิการรักษา และ Milestone เรียงตาม Priority กับ Urgency','A map of public, private, community and international actors, compared with seven other countries\' models, plus levels of care, coverage schemes and milestones ranked by priority and urgency.'],
 note:['"ในประเทศ" ตีความว่าประเทศไทย ตัวเลขเป็นค่าประมาณจากรายงานสาธารณะ (WHO GHED, OECD และรายงานของแต่ละหน่วยงาน ปี 2564–2567) ตำแหน่งบนแกนการออกแบบเป็นการประเมินเชิงคุณภาพ ควรตรวจกับแหล่งข้อมูลทางการก่อนอ้างอิง','"Domestic" is read as Thailand. Figures are approximate, from public reports (WHO GHED, OECD and agency reports, 2021–2024). Positions on the design axes are qualitative judgements. Check official sources before citing.'],
 'm-eb':['โมเดล 3 มิติ','3D model'],
 'm-h':['ความเชื่อมโยง 4 ชั้น เลือกประเทศได้','Four layers of connections, by country'],
 'm-p':['เลือกประเทศที่แถบด้านบนของโมเดล ชั้นบนสุดคือองค์กรนานาชาติ ถัดลงมาคือนโยบายและผู้จ่ายเงิน ผู้ให้บริการ และประชาชน ลากเพื่อหมุน เลื่อนล้อเพื่อซูม แตะจุดเพื่อดูบทบาทและเส้นเชื่อม','Pick a country in the bar at the top of the model. Layers run from international bodies, through policy and payers and providers, down to people. Drag to rotate, scroll to zoom, tap a node to see its role and links.'],
 'c-eb':['เทียบโมเดลประเทศ','Country models'],
 'c-h':['แต่ละประเทศตั้งโจทย์และวางรากฐานต่างกันอย่างไร','How each country framed the problem and built its foundation'],
 'c-p':['เลือกสองประเทศเพื่อเทียบทีละมิติ ระบบสุขภาพแต่ละแบบเริ่มจากคำถามที่ต่างกัน และคำถามนั้นกำหนดว่าใครจ่าย ใครให้บริการ และประชาชนเข้าถึงอย่างไร','Choose two countries to compare side by side. Each system started from a different question, and that question shaped who pays, who provides, and how people get care.'],
 'c-a':['ประเทศ A','Country A'],'c-b':['ประเทศ B','Country B'],
 'ax-h':['แกนการออกแบบ (ทุกประเทศ)','Design axes (all countries)'],
 'ov-h':['ภาพรวมทุกประเทศ','All countries at a glance'],
 'a-eb':['ผู้เล่นในระบบไทย','Thai actors'],
 'a-h':['ระบบสุขภาพไทยประกอบด้วยใครบ้าง','Who makes up the Thai health system'],
 'k-eb':['การแยกการรักษา','Types of care'],
 'k-h':['ไทยแบ่งการรักษาเป็นแบบใด','How care is divided in Thailand'],
 'k-p':['แบ่งได้สามมุม คือระดับบริการ หน้าที่ของบริการ และสิทธิที่จ่ายเงินให้ ทั้งสามมุมซ้อนกันอยู่ในผู้ป่วยคนเดียว','Three overlapping views: level of service, function of service, and the scheme that pays.'],

  document.documentElement.lang=lang;

}

function renderTable(){

  document.querySelectorAll('#mtable th button').forEach(b=>b.onclick=()=>{const k=b.dataset.sort;asc=sortKey===k?!asc:true;sortKey=k;renderTable();});
  const val=(m,k)=>k==='title'?t(m.t):k==='due'?t(m.due):k==='u'?-m.u:m[k];
  const rows=ranked.filter(m=>scope==='all'||m.s===scope).sort((a,b)=>{const x=val(a,sortKey),y=val(b,sortKey);return (x>y?1:x<y?-1:0)*(asc?1:-1);});
  document.querySelector('#mtable tbody').innerHTML=rows.map(m=>`<tr id="${m.id}"><td class="num">${m.rank}</td><td>${t(m.t)}<br><span class="scope">${m.s==='g'?t(STR['f-g']):t(STR['f-d'])}</span></td><td><span class="pill p${m.p}">P${m.p}</span></td><td><span class="pill p${4-m.u}">${t(UL[m.u])}</span></td><td class="num">${t(m.due)}</td><td>${t(m.o)}</td><td>${t(m.n)}</td></tr>`).join('');

const activeTypes=new Set(Object.keys(EV));

function legendHTML(){return '<div class="legend">'+Object.keys(EV).map(k=>`<span><i class="ln" style="background:var(${EV[k]})"></i>${t(UI.etype[k])}</span>`).join('')+Object.keys(sectorVar).map(k=>`<span><i class="dot" style="background:var(${sectorVar[k]})"></i>${t(UI.sector[k])}</span>`).join('')+'</div>';}
function showDefault(){
  panel.innerHTML=`<span class="kind">${t(cur.name)} · ${t(cur.model)}</span><h3>${t(UI.q)}</h3><blockquote>${t(cur.q)}</blockquote><p>${t(cur.found)}</p><span class="kind">${t(UI.howto)}</span><p>${t(UI.howp)}</p>${legendHTML()}<p>${N.length} ${t(UI.counts)} · ${E.length} ${t(UI.links)}</p>`;
}
function showNode(nd){
  const outs=E.filter(x=>x.s===nd.id), ins=E.filter(x=>x.t===nd.id);
  const li=(x,o,d)=>`<li><i class="ln" style="background:var(${EV[x.type]})"></i><span>${d} <button data-go="${o.id}">${t(o.label)}</button> <span style="color:var(--stage-muted)">· ${t(UI.etype[x.type])}</span></span></li>`;
  const li2=LAYERS.findIndex(l=>l.key===nd.layer);
  panel.innerHTML=`<span class="kind">${t(cur.name)} · ${t(UI.sector[nd.sector])} · ${t(UI.layers[li2])}</span><h3>${t(nd.label)}</h3><p>${t(nd.desc)}</p>`+
   (outs.length?`<span class="kind">${t(UI.out)}</span><ul>${outs.map(x=>li(x,byId[x.t],'→')).join('')}</ul>`:'')+
   (ins.length?`<span class="kind">${t(UI.inn)}</span><ul>${ins.map(x=>li(x,byId[x.s],'←')).join('')}</ul>`:'')+
   `<button class="chip" id="clearsel" style="align-self:flex-start;margin-top:6px">${t(UI.clear)}</button>`;
  panel.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>select(byId[b.dataset.go]));
  document.getElementById('clearsel').onclick=()=>select(null);
}
function renderPanel(){selected?showNode(selected):showDefault();}
function renderToolbar(){
  cbar.innerHTML=COUNTRIES.map(c=>`<button class="chip" data-c="${c.code}" aria-pressed="${c===cur}">${t(c.name)}</button>`).join('');
  cbar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>setCountry(byCode[b.dataset.c]));
  toolbar.innerHTML=Object.keys(EV).map(k=>`<button class="chip" data-e="${k}" aria-pressed="${activeTypes.has(k)}"><i class="ln" style="background:var(${EV[k]})"></i>${t(UI.etype[k])}</button>`).join('')+
    `<button class="chip" id="spin" aria-pressed="${gl?gl.controls.autoRotate:!reduce}">${t(UI.spin)}</button>`;
  toolbar.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const k=b.dataset.e;activeTypes.has(k)?activeTypes.delete(k):activeTypes.add(k);b.setAttribute('aria-pressed',activeTypes.has(k));refresh();});
  document.getElementById('spin').onclick=function(){if(!gl)return;gl.controls.autoRotate=!gl.controls.autoRotate;this.setAttribute('aria-pressed',gl.controls.autoRotate);};
}
function layout(){
  LAYERS.forEach(L=>{
    const ns=N.filter(x=>x.layer===L.key);
    const ring=ns.filter(x=>!(L.key==='people'&&x.id==='people'));
    ns.forEach(x=>{
      if(L.key==='people'&&x.id==='people'){x.pos=[0,L.y,0];return;}
      const i=ring.indexOf(x), a=(i/ring.length)*Math.PI*2+(L.key==='policy'?0.3:0);
      const r=L.key==='people'?L.r:L.r*(ns.length<8?0.8:1);
      x.pos=[Math.cos(a)*r, L.y+(L.key==='people'?0:(i%2?4:-4)), Math.sin(a)*r];
    });
  });
}
function setCountry(c){
  cur=c; selected=null; hovered=null;
  N=c.graph.N.map(x=>Object.assign({},x));
  byId=Object.fromEntries(N.map(x=>[x.id,x]));
  E=c.graph.E.map(x=>Object.assign({},x)).filter(x=>byId[x.s]&&byId[x.t]);
  layout(); renderToolbar(); renderPanel();
  if(gl) buildScene();
}
function initGL(){
  if(!window.THREE||!THREE.OrbitControls){stage.insertAdjacentHTML('beforeend',`<div class="fallback">${t(UI.nogl)}</div>`);return;}
  let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true});}catch(err){stage.insertAdjacentHTML('beforeend',`<div class="fallback">${t(UI.nogl)}</div>`);return;}
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));stage.prepend(renderer.domElement);
  const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(45,1,1,2000);
  camera.position.set(150,70,190);
  const controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true;controls.autoRotate=!reduce;controls.autoRotateSpeed=0.6;controls.minDistance=60;controls.maxDistance=520;
  scene.add(new THREE.AmbientLight(0xffffff,0.75));const dl=new THREE.DirectionalLight(0xffffff,0.6);dl.position.set(80,160,120);scene.add(dl);
  const rings=LAYERS.map((L,i)=>{
    const ring=new THREE.Mesh(new THREE.RingGeometry(L.r-0.4,L.r+0.4,96),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.12,side:THREE.DoubleSide}));
    ring.rotation.x=-Math.PI/2;ring.position.y=L.y;scene.add(ring);
    const disc=new THREE.Mesh(new THREE.CircleGeometry(L.r+8,96),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.025,side:THREE.DoubleSide}));
    disc.rotation.x=-Math.PI/2;disc.position.y=L.y-0.5;scene.add(disc);
    const tag=document.createElement('div');tag.className='lbl layer';labelsEl.appendChild(tag);
    return {i,tag,anchor:new THREE.Vector3(L.r+12,L.y,0)};
  });
  gl={renderer,scene,camera,controls,rings,group:null,meshes:[]};
  const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
  const pick=ev=>{const r=renderer.domElement.getBoundingClientRect();mouse.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1);ray.setFromCamera(mouse,camera);const h=ray.intersectObjects(gl.meshes);return h.length?h[0].object.userData.n:null;};
  let down=null;
  renderer.domElement.addEventListener('pointerdown',ev=>down=[ev.clientX,ev.clientY]);
  renderer.domElement.addEventListener('pointerup',ev=>{if(down&&Math.hypot(ev.clientX-down[0],ev.clientY-down[1])<6)select(pick(ev));down=null;});
  renderer.domElement.addEventListener('pointermove',ev=>{if(ev.pointerType!=='mouse')return;const nd=pick(ev);if(nd!==hovered){hovered=nd;renderer.domElement.style.cursor=nd?'pointer':'grab';if(!selected)refresh();}});
  const resize=()=>{const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();if(w<520)camera.position.setLength(300);};
  new ResizeObserver(resize).observe(stage);resize();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',recolor);
  new MutationObserver(recolor).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  buildScene();
  const v=new THREE.Vector3(), clock=new THREE.Clock();
  const place=(el,vec,dim)=>{v.copy(vec).project(camera);const w=stage.clientWidth,h=stage.clientHeight;if(v.z>1){el.style.opacity=0;return;}
    el.style.left=((v.x+1)/2*w)+'px';el.style.top=((1-v.y)/2*h)+'px';const d=camera.position.distanceTo(vec);el.style.opacity=dim?.18:Math.max(.35,Math.min(1,1.6-d/320));el.style.zIndex=String(1000-Math.round(d));};
  (function loop(){
    const tm=clock.getElapsedTime();controls.update();
    E.forEach(x=>{if(x.pulse&&x.pulse.visible)x.pulse.position.copy(x.curve.getPoint(reduce?.5:((tm*0.22+x.off)%1)));});
    N.forEach(x=>{if(x.el&&x.mesh)place(x.el,x.mesh.position,x.dim);});
    rings.forEach(r=>place(r.tag,r.anchor,false));
    renderer.render(scene,camera);requestAnimationFrame(loop);
  })();
  renderLabels();
}
function buildScene(){
  if(gl.group){gl.scene.remove(gl.group);gl.group.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});}
  labelsEl.querySelectorAll('.lbl.node').forEach(x=>x.remove());
  const g=new THREE.Group();gl.group=g;gl.meshes=[];
  N.forEach(x=>{
    const m=new THREE.Mesh(new THREE.SphereGeometry(x.big?4.2:2.8,24,16),new THREE.MeshStandardMaterial({color:new THREE.Color(css(sectorVar[x.sector])),roughness:.45,metalness:.1}));
    m.position.set(...x.pos);m.userData.n=x;g.add(m);gl.meshes.push(m);x.mesh=m;
    const el=document.createElement('div');el.className='lbl node'+(x.big?' big':'');labelsEl.appendChild(el);x.el=el;
  });
  E.forEach(x=>{
    const a=new THREE.Vector3(...byId[x.s].pos), b=new THREE.Vector3(...byId[x.t].pos);
    const mid=a.clone().add(b).multiplyScalar(.5).multiplyScalar(1.12);mid.y+=6;
    x.curve=new THREE.QuadraticBezierCurve3(a,mid,b);
    x.line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(x.curve.getPoints(32)),new THREE.LineBasicMaterial({color:new THREE.Color(css(EV[x.type])),transparent:true,opacity:.45}));g.add(x.line);
    x.pulse=new THREE.Mesh(new THREE.SphereGeometry(0.9,8,6),new THREE.MeshBasicMaterial({color:new THREE.Color(css(EV[x.type]))}));g.add(x.pulse);
    x.off=Math.random();
  });
  gl.scene.add(g);recolor();renderLabels();refresh();
}
function renderLabels(){
  if(!gl)return;
  N.forEach(x=>{if(x.el)x.el.textContent=t(x.label);});
  gl.rings.forEach(r=>r.tag.textContent=t(UI.layers[r.i]));
}
function recolor(){
  if(!gl)return;gl.scene.background=new THREE.Color(css('--stage'));
  N.forEach(x=>x.mesh&&x.mesh.material.color.set(css(sectorVar[x.sector])));
  E.forEach(x=>{if(!x.line)return;const c=css(EV[x.type]);x.line.material.color.set(c);x.pulse.material.color.set(c);});
}
function refresh(){
  if(!gl)return;
  const f=selected||hovered;let set=null;
  if(f){set=new Set([f.id]);E.forEach(x=>{if(!activeTypes.has(x.type))return;if(x.s===f.id)set.add(x.t);if(x.t===f.id)set.add(x.s);});}
  E.forEach(x=>{const on=activeTypes.has(x.type),rel=!f||x.s===f.id||x.t===f.id;x.line.visible=on;x.pulse.visible=on&&rel;x.line.material.opacity=f?(rel?.95:.06):.45;});
  N.forEach(x=>{const lit=!set||set.has(x.id);x.mesh.material.transparent=!lit;x.mesh.material.opacity=lit?1:.25;x.mesh.material.emissive.setHex(f&&f.id===x.id?0x333333:0);x.mesh.scale.setScalar(f&&f.id===x.id?1.5:1);x.dim=!lit;});
}
function select(nd){selected=nd;renderPanel();refresh();if(nd&&gl){gl.controls.autoRotate=false;const s=document.getElementById('spin');if(s)s.setAttribute('aria-pressed','false');}}

/* ================= Boot & language ================= */
function renderAll(){renderStatic();renderActors();renderCare();renderCompare();renderMatrix();renderTable();renderToolbar();renderPanel();renderLabels();}
function setLang(l){lang=l;try{localStorage.setItem('hsm-lang',l);}catch(err){}renderAll();}
document.getElementById('lang-th').onclick=()=>setLang('th');
document.getElementById('lang-en').onclick=()=>setLang('en');
setCountry(byCode.TH);
renderAll();
initGL();
})();
</script>

</body>
</html>
